[project]
name = "safraos"
version = "0.1.0"
description = "SafraOS — gestão de safra"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "sqlalchemy==2.0.52",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.5",
    "celery==5.6.3",
    "redis==8.1.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "httpx2==2.12.0",
    "ruff==0.15.4",
    "mypy==1.19.1",
    "celery-types==0.26.0",
]

[tool.uv]
package = false

[tool.uv.sources]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api/src", "apps/worker/src", "packages/backend/src"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "rules: regras de domínio puras",
    "database: exige PostgreSQL real",
    "integration: exige serviços do Compose",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["apps/api/src", "apps/worker/src", "packages/backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "apps/api/src:apps/worker/src:packages/backend/src"
explicit_package_bases = true
